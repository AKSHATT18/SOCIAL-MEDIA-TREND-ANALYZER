version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: socialpulse_backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - NEWS_API_KEY=${NEWS_API_KEY:-}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: socialpulse_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
